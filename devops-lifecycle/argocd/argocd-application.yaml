apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: odoo20
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://gitlab.com/nitheesh3216/odoo20-demo.git
    targetRevision: main
    path: k3s

  destination:
    server: https://kubernetes.default.svc
    namespace: odoo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false